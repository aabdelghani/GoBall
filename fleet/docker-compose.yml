services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./broker/acl.conf:/mosquitto/config/acl.conf
      - ./broker/passwd:/mosquitto/config/passwd
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    env_file:
      - server.conf
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - SSH_KEY_PATH=/keys/id_ed25519
      - SSH_USERNAME=${SSH_USERNAME:-q}
    volumes:
      - backend_data:/data
      - ./frontend:/app/static
      - ./keys:/keys:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  backend_data:
