<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBall Fleet Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body x-data="alertsPage" class="min-h-screen">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <a href="/" class="text-slate-400 hover:text-white transition-colors">&larr; Dashboard</a>
            <h1 class="text-xl font-semibold text-white">Alerts</h1>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span class="px-3 py-1 rounded-full" :class="alerts.length > 0 ? 'bg-red-900/60 text-red-300' : 'bg-green-900/60 text-green-300'">
                <span x-text="alerts.length"></span> active alerts
            </span>
            <span class="w-2 h-2 rounded-full" :class="wsConnected ? 'bg-green-400' : 'bg-red-400'"></span>
        </div>
    </header>

    <!-- Filter bar -->
    <div class="bg-slate-800/50 border-b border-slate-700 px-6 py-3 flex items-center gap-4 flex-wrap">
        <span class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Filter:</span>
        <template x-for="[key, label, color] in [
            ['all', 'All', 'bg-slate-600'],
            ['offline', 'Offline', 'bg-red-900/60'],
            ['high_temp', 'High Temp', 'bg-orange-900/60'],
            ['disk_full', 'Disk Full', 'bg-yellow-900/60'],
            ['app_down', 'App Down', 'bg-purple-900/60'],
            ['error', 'Errors', 'bg-red-900/60']
        ]">
            <button
                @click="filterType = key"
                :class="filterType === key ? color + ' text-white ring-1 ring-white/30' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
                class="px-3 py-1 rounded-full text-sm transition-colors"
                x-text="label + ' (' + countByType(key) + ')'"
            ></button>
        </template>

        <div class="ml-auto">
            <input
                x-model="search"
                type="text"
                placeholder="Search serial, message..."
                class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 w-64"
            >
        </div>
    </div>

    <!-- Alerts Table -->
    <div class="p-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-slate-700 text-left text-xs uppercase text-slate-400 tracking-wider">
                        <th class="px-4 py-3 w-12">Severity</th>
                        <th class="px-4 py-3 w-40 cursor-pointer hover:text-white" @click="toggleSort('ts')">
                            Time <span x-show="sortCol === 'ts'" x-text="sortAsc ? '&#9650;' : '&#9660;'"></span>
                        </th>
                        <th class="px-4 py-3 w-32 cursor-pointer hover:text-white" @click="toggleSort('alert_type')">
                            Type <span x-show="sortCol === 'alert_type'" x-text="sortAsc ? '&#9650;' : '&#9660;'"></span>
                        </th>
                        <th class="px-4 py-3 w-44 cursor-pointer hover:text-white" @click="toggleSort('serial')">
                            Device <span x-show="sortCol === 'serial'" x-text="sortAsc ? '&#9650;' : '&#9660;'"></span>
                        </th>
                        <th class="px-4 py-3">Message</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="alert in filteredAlerts" :key="alert.serial + alert.alert_type + alert.ts">
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition-colors">
                            <!-- Severity icon -->
                            <td class="px-4 py-3 text-center">
                                <span class="text-lg" :class="severityColor(alert.alert_type)" x-text="severityIcon(alert.alert_type)"></span>
                            </td>
                            <!-- Time -->
                            <td class="px-4 py-3 text-slate-300">
                                <div x-text="formatTime(alert.ts)"></div>
                                <div class="text-xs text-slate-500" x-text="formatAge(alert.ts)"></div>
                            </td>
                            <!-- Type -->
                            <td class="px-4 py-3">
                                <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                                    :class="typeBadgeClass(alert.alert_type)"
                                    x-text="typeLabel(alert.alert_type)"></span>
                            </td>
                            <!-- Device -->
                            <td class="px-4 py-3">
                                <a :href="'/?device=' + alert.serial" target="_blank"
                                   class="font-mono text-blue-400 hover:text-blue-300 hover:underline"
                                   x-text="alert.serial.length > 12 ? '...' + alert.serial.slice(-8) : alert.serial"></a>
                                <div class="text-xs text-slate-500 font-mono" x-text="alert.serial"></div>
                            </td>
                            <!-- Message -->
                            <td class="px-4 py-3 text-slate-200" x-text="alert.message"></td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <!-- Empty state -->
            <div x-show="filteredAlerts.length === 0" class="text-center py-16 text-slate-500">
                <div class="text-4xl mb-3">&#10003;</div>
                <p class="text-lg" x-text="alerts.length === 0 ? 'No active alerts — all systems healthy' : 'No alerts match your filter'"></p>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('alertsPage', () => ({
            alerts: [],
            filterType: 'all',
            search: '',
            sortCol: 'ts',
            sortAsc: false,
            wsConnected: false,
            ws: null,

            init() {
                // Load initial alerts via REST
                fetch('/api/alerts').then(r => r.json()).then(data => { this.alerts = data; });
                this.connectWebSocket();
            },

            connectWebSocket() {
                const proto = location.protocol === 'https:' ? 'wss' : 'ws';
                this.ws = new WebSocket(`${proto}://${location.host}/ws`);
                this.ws.onopen = () => { this.wsConnected = true; };
                this.ws.onclose = () => {
                    this.wsConnected = false;
                    setTimeout(() => this.connectWebSocket(), 3000);
                };
                this.ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'init' && msg.alerts) {
                        this.alerts = msg.alerts;
                    } else if (msg.type === 'device_update' && msg.alerts) {
                        this.alerts = msg.alerts;
                    }
                };
            },

            get filteredAlerts() {
                let list = this.alerts;
                if (this.filterType !== 'all') {
                    list = list.filter(a => a.alert_type === this.filterType);
                }
                if (this.search) {
                    const q = this.search.toLowerCase();
                    list = list.filter(a =>
                        a.serial.toLowerCase().includes(q) ||
                        a.message.toLowerCase().includes(q) ||
                        a.alert_type.toLowerCase().includes(q)
                    );
                }
                return [...list].sort((a, b) => {
                    let va = a[this.sortCol], vb = b[this.sortCol];
                    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
                    if (va < vb) return this.sortAsc ? -1 : 1;
                    if (va > vb) return this.sortAsc ? 1 : -1;
                    return 0;
                });
            },

            countByType(type) {
                if (type === 'all') return this.alerts.length;
                return this.alerts.filter(a => a.alert_type === type).length;
            },

            toggleSort(col) {
                if (this.sortCol === col) { this.sortAsc = !this.sortAsc; }
                else { this.sortCol = col; this.sortAsc = false; }
            },

            severityIcon(type) {
                const icons = { offline: '&#9676;', high_temp: '&#9888;', disk_full: '&#9888;', app_down: '&#9724;', error: '&#10007;' };
                return icons[type] || '?';
            },

            severityColor(type) {
                const colors = { offline: 'text-red-400', high_temp: 'text-orange-400', disk_full: 'text-yellow-400', app_down: 'text-purple-400', error: 'text-red-500' };
                return colors[type] || 'text-slate-400';
            },

            typeLabel(type) {
                const labels = { offline: 'Offline', high_temp: 'High Temp', disk_full: 'Disk Full', app_down: 'App Down', error: 'Error' };
                return labels[type] || type;
            },

            typeBadgeClass(type) {
                const cls = {
                    offline: 'bg-red-900/50 text-red-300',
                    high_temp: 'bg-orange-900/50 text-orange-300',
                    disk_full: 'bg-yellow-900/50 text-yellow-300',
                    app_down: 'bg-purple-900/50 text-purple-300',
                    error: 'bg-red-900/50 text-red-300',
                };
                return cls[type] || 'bg-slate-700 text-slate-300';
            },

            formatTime(ts) {
                return new Date(ts * 1000).toLocaleString();
            },

            formatAge(ts) {
                const secs = Math.floor(Date.now() / 1000 - ts);
                if (secs < 60) return secs + 's ago';
                if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
                if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
                return Math.floor(secs / 86400) + 'd ago';
            },
        }));
    });
    </script>
</body>
</html>
