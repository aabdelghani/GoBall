# =============================================================================
# GoBall Fleet Monitor — Server Configuration
# =============================================================================
# Copy this file to your server and edit the values below.
# Then run: docker compose --env-file server.conf up -d
# =============================================================================

# --- MQTT Broker ---
MQTT_BROKER_PORT=1883
MQTT_USERNAME=backend
MQTT_PASSWORD=changeme

# --- Dashboard ---
DASHBOARD_PORT=8000

# --- Database ---
SQLITE_DB_PATH=/data/fleet.db

# --- Alert Thresholds ---
ALERT_OFFLINE_SECONDS=300
ALERT_CPU_TEMP_C=80
ALERT_DISK_USED_PCT=90

# --- Data Retention ---
EVENT_RETENTION_DAYS=7

# --- TLS (optional, uncomment for production) ---
# Port for mTLS listener (Pi agents connect here with client certs)
# MQTT_TLS_PORT=8883

# --- Device Auth ---
# Password used by all Pi agents to connect to the broker.
# Change this and update agent.conf on all Pis.
DEVICE_USERNAME=goball
DEVICE_PASSWORD=changeme

# --- SSH Terminal ---
# SSH key for connecting to Pi devices (web terminal feature)
# This key must be authorized on all Pi devices (~/.ssh/authorized_keys)
SSH_KEY_PATH=~/.ssh/id_ed25519
SSH_USERNAME=q
