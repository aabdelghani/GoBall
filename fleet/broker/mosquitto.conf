# Mosquitto configuration for GoBall Fleet Monitoring

# =============================================================================
# Plain MQTT — backend only (Docker internal network)
# =============================================================================
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# =============================================================================
# mTLS — Pi agents (external)
# =============================================================================
# Uncomment the block below after generating certs (fleet/certs/generate.sh).
# Each device's cert CN (its serial number) becomes the MQTT username
# via use_identity_as_username, so no password file is needed on this listener.
# -----------------------------------------------------------------------------
listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# ACL (shared by both listeners)
acl_file /mosquitto/config/acl.conf

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

# Performance tuning for 10K+ connections
max_connections 15000
message_size_limit 65536

# Retained messages (for status topics)
retain_available true
