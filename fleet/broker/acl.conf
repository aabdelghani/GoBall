# Backend has full read/write access (password auth, port 1883)
user backend
topic readwrite goball/#

# Shared "goball" user for password-auth devices (port 1883)
user goball
topic write goball/#
topic read goball/#

# mTLS clients: CN = device serial, can only access own topics (port 8883)
# With use_identity_as_username, the cert CN becomes %u
pattern readwrite goball/%u/#
