# =============================================================================
# GoBall Fleet Agent — Pi Configuration
# =============================================================================
# Copy this file to /etc/goball-agent.conf on each Raspberry Pi.
# The agent reads this on startup. Restart after changes:
#   sudo systemctl restart goball-agent
# =============================================================================

# --- Server Connection ---
# IP or hostname of the fleet monitoring server
MQTT_BROKER_HOST=fleet.example.com
MQTT_BROKER_PORT=1883

# --- Credentials ---
# Must match DEVICE_USERNAME/DEVICE_PASSWORD in server.conf
MQTT_USERNAME=goball
MQTT_PASSWORD=changeme

# --- Venue Info ---
# Human-readable name for this device (shown on dashboard)
VENUE_NAME=My Mini Golf Venue
DEVICE_LABEL=Hole 1

# --- Location (for world map) ---
# Decimal degrees. Use Google Maps to find coordinates.
LATITUDE=40.7128
LONGITUDE=-74.0060

# --- Telemetry ---
# How often to publish system metrics (seconds)
PUBLISH_INTERVAL=30

# --- TLS (optional, uncomment for production) ---
# MQTT_TLS_CA=/etc/goball-agent/ca.crt
